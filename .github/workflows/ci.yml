name: CI

on:
  push:
    branches: [ master, ci_testing ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      version:
        description: "c3c release to build with"
        required: false
        default: "v0.8.6"

permissions:
  contents: read

env:
  C3_VERSION: ${{ github.event.inputs.version || 'v0.8.6' }}
  PAHO_COMMIT: fdab9d2b1ce125385135e5d9f282a0ad315268cc

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install c3c
        run: |
          curl -fsSL -o c3.tar.gz "https://github.com/c3lang/c3c/releases/download/${C3_VERSION}/c3-linux.tar.gz"
          mkdir -p "$HOME/c3" && tar -xzf c3.tar.gz -C "$HOME/c3"
          echo "$(dirname "$(find "$HOME/c3" -name c3c -type f | head -1)")" >> "$GITHUB_PATH"
      - name: Version
        run: c3c --version
      - name: Unit tests
        run: c3c test
      - name: Unit tests with AddressSanitizer
        run: c3c test --sanitize=address
      - name: Build mqttc
        run: c3c build mqttc
      - name: Build itest
        run: c3c build itest
      - name: Peer runner checks
        run: python3 tools/test_peer.py
      - name: Peer tests, Paho interoperability broker
        run: |
          mkdir -p .work/peer
          git clone https://github.com/eclipse/paho.mqtt.testing .work/peer/paho
          git -C .work/peer/paho checkout "$PAHO_COMMIT"
          python3 tools/peer.py --kind paho --version 3.1.1 --require-pass
          python3 tools/peer.py --kind paho --version 5 --require-pass
      - name: Peer tests, mosquitto from apt (does not block until it has run once)
        continue-on-error: true
        run: |
          sudo apt-get update && sudo apt-get install -y mosquitto
          python3 tools/peer.py --kind mosquitto --version 3.1.1 --require-pass
          python3 tools/peer.py --kind mosquitto --version 5 --require-pass

  build-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install c3c
        run: |
          curl -fsSL -o c3.zip "https://github.com/c3lang/c3c/releases/download/${C3_VERSION}/c3-macos.zip"
          mkdir -p "$HOME/c3" && unzip -q c3.zip -d "$HOME/c3"
          echo "$(dirname "$(find "$HOME/c3" -name c3c -type f | head -1)")" >> "$GITHUB_PATH"
      - name: Version
        run: c3c --version
      - name: Unit tests
        run: c3c test
      - name: Build mqttc
        run: c3c build mqttc
      - name: Build itest
        run: c3c build itest
      - name: Peer tests, mosquitto from brew (does not block yet)
        continue-on-error: true
        run: |
          brew install mosquitto
          python3 tools/peer.py --kind mosquitto --version 3.1.1 --require-pass
          python3 tools/peer.py --kind mosquitto --version 5 --require-pass

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install c3c
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/c3lang/c3c/releases/download/$env:C3_VERSION/c3-windows.zip" -OutFile c3.zip
          Expand-Archive c3.zip -DestinationPath "$HOME\c3"
          $dir = (Get-ChildItem "$HOME\c3" -Recurse -Filter c3c.exe | Select-Object -First 1).DirectoryName
          Add-Content $env:GITHUB_PATH $dir
      - name: Version
        run: c3c --version
      - name: Unit tests
        run: c3c test
      - name: Build mqttc
        run: c3c build mqttc
      - name: Build itest
        run: c3c build itest
